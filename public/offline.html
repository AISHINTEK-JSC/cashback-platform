<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Không có kết nối mạng - Ví Hoàn Tiền</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Trang tĩnh do service worker hiện khi mất mạng: không dùng được Vite/Blade nên CSS viết thẳng ở đây -->
    <script>
        (() => {
            let theme = null;
            try { theme = localStorage.getItem('theme'); } catch {}
            const isDark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', isDark);
        })();
    </script>
    <style>
        :root { --bg: #fafaf9; --card: #ffffff; --border: #e7e5e4; --text: #1c1917; --muted: #57534e; --brand: #e04412; }
        html.dark { --bg: #0c0a09; --card: #17120f; --border: #292524; --text: #f5f5f4; --muted: #a8a29e; color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .card { width: 100%; max-width: 420px; padding: 32px 24px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
        img { width: 56px; height: 56px; }
        h1 { margin: 16px 0 8px; font-size: 1.375rem; }
        p { margin: 0; color: var(--muted); line-height: 1.5; }
        button { margin-top: 24px; padding: 10px 20px; font: inherit; font-weight: 600; color: #fff; background: var(--brand); border: 0; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <main class="card">
        <img src="/icon-192.png" alt="">
        <h1>Bạn đang ngoại tuyến</h1>
        <p>Không kết nối được tới Ví Hoàn Tiền. Kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại.</p>
        <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
