memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
expose_php = Off
; Image FrankenPHP không có php.ini nên mặc định bật; tắt cho giống local, tránh <?xml bị hiểu là thẻ PHP
short_open_tag = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
