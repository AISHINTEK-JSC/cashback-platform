# Chạy toàn bộ hệ thống: docker compose up -d --build
# Web: http://localhost:8001  |  Admin: http://localhost:8001/admin  |  Mailpit: http://localhost:8025

x-app-environment: &app-environment
  APP_NAME: "Sàn Hoàn Tiền"
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: http://localhost:${APP_PORT:-8001}
  APP_LOCALE: vi
  APP_FAKER_LOCALE: vi_VN
  APP_TIMEZONE: Asia/Ho_Chi_Minh
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306 # cổng trong mạng Docker, không phải cổng mở ra máy host (DB_FORWARD_PORT)
  DB_DATABASE: cashback
  DB_USERNAME: cashback
  DB_PASSWORD: secret
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: no-reply@sanhoantien.local
  MAIL_FROM_NAME: "Sàn Hoàn Tiền"
  AFFILIATE_SHOPEE_DRIVER: ${AFFILIATE_SHOPEE_DRIVER:-fake}
  AFFILIATE_TIKTOK_DRIVER: ${AFFILIATE_TIKTOK_DRIVER:-fake}
  AFFILIATE_LAZADA_DRIVER: ${AFFILIATE_LAZADA_DRIVER:-fake}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
  FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}

services:
  app:
    build: .
    image: san-hoan-tien:latest
    environment:
      <<: *app-environment
      CONTAINER_ROLE: app
      SEED_DATABASE: ${SEED_DATABASE:-true}
    ports:
      - "${APP_PORT:-8001}:80"
    volumes:
      - storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  queue:
    image: san-hoan-tien:latest
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      <<: *app-environment
      CONTAINER_ROLE: worker
    volumes:
      - storage:/app/storage
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  scheduler:
    image: san-hoan-tien:latest
    command: php artisan schedule:work
    environment:
      <<: *app-environment
      CONTAINER_ROLE: worker
    volumes:
      - storage:/app/storage
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cashback
      MYSQL_USER: cashback
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  storage:
  mysql-data:
