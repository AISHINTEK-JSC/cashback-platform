# Chạy toàn bộ hệ thống: docker compose up -d --build
# Web: http://localhost:8001  |  Admin: http://localhost:8001/super/admin  |  Mailpit: http://localhost:8025

x-app-environment: &app-environment
  APP_NAME: "Ví Hoàn Tiền"
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_KEY: ${APP_KEY:-} # phải trùng APP_KEY trên production vì dùng chung DB
  APP_URL: http://localhost:${APP_PORT:-8001}
  APP_LOCALE: vi
  APP_FAKER_LOCALE: vi_VN
  APP_TIMEZONE: Asia/Ho_Chi_Minh
  LOG_CHANNEL: stderr
  # Supabase (Postgres) dùng chung với production, thông tin lấy từ .env
  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-postgres}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_SSLMODE: require
  # Session/cache để file (volume storage dùng chung giữa các container): DB ở xa, mỗi truy vấn mất ~150ms
  SESSION_DRIVER: file
  CACHE_STORE: file
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: no-reply@vihoantien.id.vn
  MAIL_FROM_NAME: "Ví Hoàn Tiền"
  AFFILIATE_SHOPEE_DRIVER: ${AFFILIATE_SHOPEE_DRIVER:-fake}
  AFFILIATE_TIKTOK_DRIVER: ${AFFILIATE_TIKTOK_DRIVER:-fake}
  AFFILIATE_LAZADA_DRIVER: ${AFFILIATE_LAZADA_DRIVER:-fake}
  ACCESSTRADE_API_KEY: ${ACCESSTRADE_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
  FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
  # File tải lên lưu R2 (DB dùng chung với production nên local cũng phải lưu cùng chỗ)
  UPLOADS_DRIVER: ${UPLOADS_DRIVER:-local}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-}
  R2_ENDPOINT: ${R2_ENDPOINT:-}
  R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}

services:
  app:
    build: .
    image: san-hoan-tien:latest
    environment:
      <<: *app-environment
      CONTAINER_ROLE: app
      SEED_DATABASE: ${SEED_DATABASE:-false}
    ports:
      - "${APP_PORT:-8001}:80"
    volumes:
      - storage:/app/storage
    restart: unless-stopped

  # queue/scheduler chạy trên DB production nên chỉ bật khi cần: docker compose --profile workers up -d
  queue:
    image: san-hoan-tien:latest
    profiles: [workers]
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      <<: *app-environment
      CONTAINER_ROLE: worker
    volumes:
      - storage:/app/storage
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  scheduler:
    image: san-hoan-tien:latest
    profiles: [workers]
    command: php artisan schedule:work
    environment:
      <<: *app-environment
      CONTAINER_ROLE: worker
    volumes:
      - storage:/app/storage
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  storage:
